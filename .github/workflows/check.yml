name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Link sandworm
        # package.json links sandworm from a local checkout (`link:sandworm`); CI clones and links it the same way.
        run: git clone --depth 1 https://github.com/danmcfan/sandworm ../sandworm && cd ../sandworm && bun install --frozen-lockfile && bun link
      - run: bun install --frozen-lockfile
      - run: bun run check
