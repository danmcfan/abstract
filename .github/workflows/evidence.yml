name: Evidence

# A PR that changes what a player sees carries screenshots or a video
# (docs/agents/verify.md). `edited` re-runs this when the body changes.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-evidence.sh ${{ github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ github.token }}
